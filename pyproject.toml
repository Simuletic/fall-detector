[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detector"
version = "1.0.0"
description = "Simuletic Fall Detector: person lying on the ground or floor, trained only on synthetic CCTV images"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["torch>=2.3", "transformers>=4.57", "huggingface_hub>=0.25", "pillow>=10", "numpy>=1.26", "opencv-python>=4.9", "onnxruntime>=1.18"]

[project.urls]
Homepage = "https://simuletic.com"
Model = "https://huggingface.co/Simuletic/fall-detector"

[tool.setuptools]
packages = ["fall_detector"]
